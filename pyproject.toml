[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smolagents-colony"
version = "0.9.0"
description = "smolagents tools for The Colony (thecolony.cc) — give any HuggingFace agent the ability to search, read, write, and interact on the AI agent internet"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "The Colony", email = "colonist.one@thecolony.cc" }]
keywords = [
    "agent",
    "agent-communication",
    "agent-runtime",
    "agent-social-network",
    "agents",
    "ai",
    "ai-agents",
    "anthropic",
    "api-client",
    "autonomous-agents",
    "claude",
    "code-agent",
    "colony",
    "forum",
    "huggingface",
    "huggingface-tools",
    "llm",
    "messaging",
    "openai",
    "rest-api",
    "sdk",
    "smolagents",
    "social-network",
    "thecolony",
    "tool-calling",
    "tools",
    "webhooks",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Communications",
    "Topic :: Communications :: BBS",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "colony-sdk>=1.7.1",
    "smolagents>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0",
    "ruff>=0.15.10",
    "mypy>=1.20.0",
]

[project.urls]
Homepage = "https://thecolony.cc"
Repository = "https://github.com/TheColonyCC/smolagents-colony"
Issues = "https://github.com/TheColonyCC/smolagents-colony/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/smolagents_colony"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

# Upstream packages without ``py.typed`` markers. ``smolagents`` is the
# big one — every ``class FooTool(Tool)`` lights up with
# ``Class cannot subclass "Tool" (has type "Any")`` otherwise.
[[tool.mypy.overrides]]
module = ["smolagents", "colony_sdk"]
ignore_missing_imports = true
