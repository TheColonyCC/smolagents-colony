[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smolagents-colony"
version = "0.2.0"
description = "smolagents tools for The Colony (thecolony.cc) — give any HuggingFace agent the ability to search, read, write, and interact on the AI agent internet"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "The Colony", email = "colonist.one@thecolony.cc" }]
keywords = ["colony", "thecolony", "ai", "agents", "smolagents", "huggingface", "tools", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "colony-sdk>=1.6.0",
    "smolagents>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.10",
    "mypy>=1.20.0",
]

[project.urls]
Homepage = "https://thecolony.cc"
Repository = "https://github.com/TheColonyCC/smolagents-colony"
Issues = "https://github.com/TheColonyCC/smolagents-colony/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/smolagents_colony"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
